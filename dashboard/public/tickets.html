<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tickets — Nova</title>
<link rel="stylesheet" href="/nova-shared.css">
<style>
.ticket-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.ticket-row:hover .ticket-subject{color:var(--accent2);}
.ticket-row:last-child{border-bottom:none;}
.ticket-subject{font-weight:500;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s;}
.ticket-meta{font-size:12px;color:var(--text2);flex-shrink:0;}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">Nova<span>.</span></div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="/dashboard"><span class="icon">🏠</span> Dashboard</a>
      <a class="nav-item active" href="/tickets"><span class="icon">🎫</span> Tickets</a>
      <a class="nav-item" href="/account"><span class="icon">👤</span> Account</a>
      <div id="staffLinks" style="display:none">
        <div class="nav-section">Staff</div>
        <a class="nav-item" href="/admin"><span class="icon">🛡️</span> Staff Panel</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip"><img class="user-avatar" id="uav" src="" alt=""><div><div class="user-name" id="uname">…</div></div></div>
      <a class="logout-btn" href="/auth/logout">← Log out</a>
    </div>
  </aside>
  <main class="main-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px">
      <div class="page-header" style="margin-bottom:0"><h1>Tickets</h1><p id="ticketSubtitle">Your support tickets</p></div>
      <a class="btn btn-primary" href="/support">+ New Ticket</a>
    </div>
    <div id="filterBar" style="display:none;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="setFilter('')" id="f-all">All</button>
      <button class="btn btn-ghost btn-sm" onclick="setFilter('open')" id="f-open">Open</button>
      <button class="btn btn-ghost btn-sm" onclick="setFilter('in_progress')" id="f-in_progress">In Progress</button>
      <button class="btn btn-ghost btn-sm" onclick="setFilter('closed')" id="f-closed">Closed</button>
    </div>
    <div class="card">
      <div id="ticketList"><div class="loading-state"><div class="spinner"></div></div></div>
    </div>
    <footer style="margin-top:56px;padding-top:20px;border-top:1px solid var(--border);color:var(--text3);font-size:12px;text-align:center">Powered by Lumora Services</footer>
  </main>
</div>
<script>
let ALL_TICKETS=[], IS_ADMIN=false, filter='';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function setFilter(f){filter=f;document.querySelectorAll('[id^="f-"]').forEach(b=>b.classList.toggle('btn-primary',b.id==='f-'+(f||'all')));document.querySelectorAll('[id^="f-"]').forEach(b=>b.classList.toggle('btn-ghost',b.id!=='f-'+(f||'all')));renderTickets();}

async function init(){
  const me=await fetch('/api/me').then(r=>r.json()).catch(()=>null);
  if(!me){location.href='/login';return;}
  const av=me.avatar&&me.discord_id?`https://cdn.discordapp.com/avatars/${me.discord_id}/${me.avatar}.png?size=64`:`https://cdn.discordapp.com/embed/avatars/0.png`;
  document.getElementById('uav').src=av; document.getElementById('uname').textContent=me.username;
  IS_ADMIN=me.isAdmin;
  if(IS_ADMIN){document.getElementById('staffLinks').style.display='block';document.getElementById('ticketSubtitle').textContent='All support tickets';document.getElementById('filterBar').style.display='flex';}
  ALL_TICKETS=await fetch('/api/tickets').then(r=>r.json()).catch(()=>[]);
  renderTickets();
}

function renderTickets(){
  const list=filter?ALL_TICKETS.filter(t=>t.status===filter):ALL_TICKETS;
  const el=document.getElementById('ticketList');
  if(!list.length){el.innerHTML='<p style="color:var(--text2);text-align:center;padding:32px">No tickets '+(filter?'with status "'+filter+'"':'yet')+'.</p>';return;}
  el.innerHTML=list.map(t=>`
    <div class="ticket-row" onclick="location.href='/tickets/${t.id}'">
      <div style="flex:1;min-width:0">
        <div class="ticket-subject">${esc(t.subject)}</div>
        ${IS_ADMIN?`<div style="font-size:12px;color:var(--text2);margin-top:2px">${esc(t.username)} ${t.discord_id?'· '+t.discord_id:''}</div>`:''}
      </div>
      <div class="ticket-meta" style="text-align:right">
        <div><span class="badge badge-${t.status==='open'?'open':t.status==='closed'?'closed':'pending'}">${t.status.replace('_',' ')}</span></div>
        <div style="margin-top:4px">${new Date(t.created_at*1000).toLocaleDateString()}</div>
      </div>
    </div>`).join('');
}
init();
</script>
</body>
</html>
