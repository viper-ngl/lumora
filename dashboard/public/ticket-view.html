<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ticket — Nova</title>
<link rel="stylesheet" href="/nova-shared.css">
<style>
.msg{padding:12px 16px;border-radius:var(--radius-lg);max-width:80%;margin-bottom:10px;font-size:14px;line-height:1.6;}
.msg-user{background:var(--bg3);border:1px solid var(--border);align-self:flex-start;}
.msg-staff{background:var(--accent-dim);border:1px solid rgba(124,111,255,.25);align-self:flex-end;}
.msg-who{font-size:11px;font-weight:600;margin-bottom:4px;}
.msg-user .msg-who{color:var(--text2);}
.msg-staff .msg-who{color:var(--accent2);}
.msg-time{font-size:11px;color:var(--text3);margin-top:4px;}
.msg-area{display:flex;flex-direction:column;gap:2px;padding:20px;min-height:300px;max-height:500px;overflow-y:auto;}
.reply-box{border-top:1px solid var(--border);padding:16px 20px;display:flex;gap:10px;align-items:flex-end;}
.reply-box textarea{flex:1;min-height:60px;max-height:120px;resize:vertical;}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">Nova<span>.</span></div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="/dashboard"><span class="icon">🏠</span> Dashboard</a>
      <a class="nav-item" href="/tickets"><span class="icon">←</span> All Tickets</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip"><img class="user-avatar" id="uav" src="" alt=""><div><div class="user-name" id="uname">…</div></div></div>
      <a class="logout-btn" href="/auth/logout">← Log out</a>
    </div>
  </aside>
  <main class="main-content">
    <div id="content"><div class="loading-state"><div class="spinner"></div><p>Loading ticket…</p></div></div>
    <footer style="margin-top:56px;padding-top:20px;border-top:1px solid var(--border);color:var(--text3);font-size:12px;text-align:center">Powered by Lumora Services</footer>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const ticketId = location.pathname.split('/').pop();
let ME=null, TICKET=null, IS_ADMIN=false;
function toast(msg,ok=true){const t=document.getElementById('toast');t.textContent=(ok?'✅ ':'❌ ')+msg;t.className='toast show '+(ok?'success':'error');setTimeout(()=>t.classList.remove('show'),3500);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function load(){
  ME=await fetch('/api/me').then(r=>r.json()).catch(()=>null);
  if(!ME){location.href='/login';return;}
  const av=ME.avatar&&ME.discord_id?`https://cdn.discordapp.com/avatars/${ME.discord_id}/${ME.avatar}.png?size=64`:`https://cdn.discordapp.com/embed/avatars/0.png`;
  document.getElementById('uav').src=av; document.getElementById('uname').textContent=ME.username;
  IS_ADMIN=ME.isAdmin;
  const r=await fetch(`/api/tickets/${ticketId}`);
  if(!r.ok){document.getElementById('content').innerHTML=`<div style="text-align:center;padding:60px;color:var(--text2)">Ticket not found. <a href="/tickets" style="color:var(--accent)">Back</a></div>`;return;}
  TICKET=await r.json();
  render();
}

function render(){
  const statusColors={open:'open',in_progress:'pending',closed:'closed'};
  document.getElementById('content').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px">
      <div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:4px"><a href="/tickets" style="color:var(--text2);text-decoration:none">← Tickets</a></div>
        <h1 style="font-size:1.4rem;font-weight:700">${esc(TICKET.subject)}</h1>
        <div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="badge badge-${statusColors[TICKET.status]||'pending'}">${TICKET.status.replace('_',' ')}</span>
          <span style="font-size:12px;color:var(--text2)">Priority: ${TICKET.priority}</span>
          <span style="font-size:12px;color:var(--text2)">Opened ${new Date(TICKET.created_at*1000).toLocaleDateString()}</span>
          ${IS_ADMIN?`<span style="font-size:12px;color:var(--text2)">By: ${esc(TICKET.username)}</span>`:''}
        </div>
      </div>
      ${IS_ADMIN?`<div style="display:flex;gap:8px">
        <select id="statusSelect" style="font-size:13px;padding:7px 10px;width:auto" onchange="updateStatus()">
          <option value="open" ${TICKET.status==='open'?'selected':''}>Open</option>
          <option value="in_progress" ${TICKET.status==='in_progress'?'selected':''}>In Progress</option>
          <option value="closed" ${TICKET.status==='closed'?'selected':''}>Closed</option>
        </select>
      </div>`:''}
    </div>
    <div class="card" style="padding:0">
      <div class="msg-area" id="msgArea">
        ${(TICKET.messages||[]).map(m=>`
          <div class="msg ${m.is_staff?'msg-staff':'msg-user'}">
            <div class="msg-who">${esc(m.username)}${m.is_staff?' · Staff':''}</div>
            <div>${esc(m.message)}</div>
            <div class="msg-time">${new Date(m.created_at*1000).toLocaleString()}</div>
          </div>`).join('')}
      </div>
      ${TICKET.status!=='closed'?`<div class="reply-box">
        <textarea id="replyMsg" placeholder="Type your reply…"></textarea>
        <button class="btn btn-primary" onclick="sendReply()">Send</button>
      </div>`:`<div style="padding:16px 20px;text-align:center;font-size:13px;color:var(--text2)">This ticket is closed.</div>`}
    </div>`;
  // Scroll messages to bottom
  const ma=document.getElementById('msgArea');
  if(ma) ma.scrollTop=ma.scrollHeight;
}

async function sendReply(){
  const msg=document.getElementById('replyMsg').value.trim();
  if(!msg){toast('Message required.',false);return;}
  const r=await fetch(`/api/tickets/${ticketId}/reply`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
  const d=await r.json();
  if(r.ok){document.getElementById('replyMsg').value='';await load();}
  else toast(d.error||'Failed.',false);
}

async function updateStatus(){
  const status=document.getElementById('statusSelect').value;
  const r=await fetch(`/api/tickets/${ticketId}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
  if(r.ok){toast('Status updated.');await load();}
  else toast('Failed.',false);
}

// Auto-refresh every 15 seconds for live updates
setInterval(async()=>{
  if(!TICKET)return;
  const r=await fetch(`/api/tickets/${ticketId}`);
  if(r.ok){const d=await r.json();if(d.messages?.length!==(TICKET.messages||[]).length){TICKET=d;render();}}
},15000);

load();
</script>
</body>
</html>
